name: EAS Build

# Builds run on Expo's EAS servers; this workflow only checks the code and queues them.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: eas.json build profile
        type: choice
        options: [production, preview, development]
        default: production
      submit:
        description: Submit to the store after a production build
        type: boolean
        default: false
  push:
    tags:
      - "v*" # e.g. git tag v1.0.1 && git push origin v1.0.1 -> production Android build

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    name: Build ${{ inputs.platform || 'android' }} (${{ inputs.profile || 'production' }})
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Optional override; app.config.ts falls back to the @sasquare project ID.
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      PLATFORM: ${{ inputs.platform || 'android' }}
      PROFILE: ${{ inputs.profile || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required settings
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then echo "::error::Add the EXPO_TOKEN repository secret."; exit 1; fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Write Play Store service account
        if: ${{ inputs.submit && env.PROFILE == 'production' && env.PLATFORM != 'ios' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then echo "::error::Add the GOOGLE_SERVICE_ACCOUNT_JSON secret to submit."; exit 1; fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-play-service-account.json

      - name: Queue EAS build
        run: |
          ARGS="--platform $PLATFORM --profile $PROFILE --non-interactive"
          if [ "${{ inputs.submit }}" = "true" ] && [ "$PROFILE" = "production" ]; then
            # Waits for the build, then uploads it (Play internal track / App Store Connect).
            eas build $ARGS --auto-submit
          else
            # Returns as soon as the build is queued; follow progress on expo.dev.
            eas build $ARGS --no-wait
          fi

      - name: Remove service account file
        if: always()
        run: rm -f google-play-service-account.json
